     BANCO DE PRUEBAS DEL PDF
     ============================================================

     Este archivo NO se sube a Apps Script. Existe para poder ajustar

     Reproduce lo que hace buildBudgetHtml_() en PdfService.gs:
       - el mismo CSS, carácter a carácter (ver BLOQUE SINCRONIZADO)
       - el mismo troceado manual en bloques de folio (ROWS_PER_PAGE)
       - la misma estructura de nodos (.page-header, .legal-footer,
         .content, tabla, totales y firma en el último bloque)
       - los mismos formateadores de número (sin símbolo de moneda)

     CÓMO TRABAJAR AQUÍ
     1. Abre este archivo en el navegador y toca lo que quieras
        dentro del BLOQUE SINCRONIZADO.
     2. Comprueba el resultado con "Imprimir / Guardar como PDF"
        (Chrome, A4, sin márgenes del navegador).
     3. Cuando te guste, copia ese CSS tal cual a PdfService.gs, a la
        cadena de <style> de buildBudgetHtml_. Como es el mismo texto,
        no hay que reinterpretar nada: se pega y ya.

     REGLAS PARA QUE ESTO SIGA SIENDO FIEL
     - Todo lo que sea solo para ver esto en pantalla (fondo gris,
       sombra del folio, botón de imprimir) vive en @media screen y
       NUNCA se copia a PdfService.gs.
     - Si cambias la estructura de nodos, cámbiala también en
       buildBudgetHtml_. Si solo cambias CSS, basta con copiar el
       bloque.

     LO QUE ESTE BANCO NO PUEDE PREDECIR
     El PDF real no lo genera Chrome, sino el conversor de Apps Script
     (Utilities / getAs). Ese motor es bastante más limitado, y ahí se
     estrellaron los Sprints 010-011 (ver la cabecera de PdfService.gs):
     @page no frena una tabla que se repagina sola, y thead/tfoot no se
     repiten por folio. Lo que sí se repite de forma fiable en cada
     folio es position:fixed, y por eso la cabecera y el pie legal lo
     usan.

     Traducción práctica: fíate de este banco para tipografía, colores,
     anchos de columna y espaciados. Para cualquier cosa que toque
     saltos de página o el anclaje de la cabecera/pie, verifica siempre
     con un PDF generado de verdad desde Apps Script antes de darlo por

============================================================ -->

  :root{

<script>

const BUDGET = {

/* ---- Formateadores: espejo de formatMoney_ / formatNumber_ ----
   Sin símbolo de moneda, tal como quedó en el Sprint 007. */
function formatMoney(value) {
  if (value === null || value === undefined || value === '') return '';
  const n = Number(value);
  if (isNaN(n)) return escapeHtml(String(value));
  return n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatNumber(value) {
  if (value === null || value === undefined || value === '') return '';
  const n = Number(value);
  if (isNaN(n)) return escapeHtml(String(value));
  return n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Espejo de chunkArray_.
function chunkArray(arr, size) {
  if (!arr.length) return [[]];
  const chunks = [];
  for (let i = 0; i < arr.length; i += size) {
    chunks.push(arr.slice(i, i + size));
  }
  return chunks;
}

// Espejo de buildBudgetHtml_.
function buildBudgetHtml(b) {
  const esc = escapeHtml;
  const money = formatMoney;
  const num = formatNumber;

  const docNumber = b['Presupuesto']
    ? '<div class="doc-number">' + esc(b['Presupuesto']) + '</div>'

  const docDate = b['Fecha']

  const tiendaLines = [
    COMPANY.NAME ? '<div class="party-name">' + esc(COMPANY.NAME) + '</div>' : '',
    COMPANY.ADDRESS_LINE_1 ? '<div class="party-line">' + esc(COMPANY.ADDRESS_LINE_1) + '</div>' : '',
    COMPANY.ADDRESS_LINE_2 ? '<div class="party-line">' + esc(COMPANY.ADDRESS_LINE_2) + '</div>' : '',
    COMPANY.PHONE ? '<div class="party-line">Tel.: ' + esc(COMPANY.PHONE) + '</div>' : ''
  ].filter(Boolean).join('');

  const clienteLines = [
    b['Cliente'] ? '<div class="party-name upper">' + esc(b['Cliente']) + '</div>' : '',
    b['Dirección'] ? '<div class="party-line">' + esc(b['Dirección']) + '</div>' : '',
    b['Teléfono'] ? '<div class="party-line">Teléfono: ' + esc(b['Teléfono']) + '</div>' : '',

  const total = b['Total'];

    !isNaN(Number(subtotal)) && !isNaN(Number(total));
  const ivaAmount = hasIva ? Number(total) - Number(subtotal) : null;

  const pageHeaderHtml = '' +
    '<div class="page-header">' +
    '<div class="doc-header">' +
    '<div class="side"></div>' +
    '<div class="doc-title-block">' +
    '<div class="doc-type">LISTA DE COMPRA</div>' +
    docNumber +
    docDate +
    '</div>' +
    '<div class="side"></div>' +
    '</div>' +
    '<div class="parties">' +
    '<div>' + tiendaLines + '</div>' +
    '<div>' + clienteLines + '</div>' +
    '</div>' +
    '<div class="attended-row">' +
    '<div class="party-line">' + atendidoPor + '</div>' +
    '<div></div>' +
    '</div>' +
    '<div class="courtesy">' +
    '<div>GRACIAS POR SU CONFIANZA EN ESTE PROYECTO.</div>' +
    '<div>DOCUMENTO ELABORADO PARA FACILITAR LA COMPRA DE LOS MATERIALES.</div>' +
    '</div>' +
    '</div>';

  const legalFooterHtml = '' +
    '<div class="legal-footer">' +
    '<div class="legal">' +
    '<p><strong>Aviso:</strong> los precios indicados son orientativos y están sujetos a disponibilidad en tienda. ' +
    '<strong>Validez:</strong> esta lista de compra no constituye un presupuesto vinculante ni una oferta comercial. ' +
    '<strong>Uso:</strong> documento de uso interno, sin validez como factura ni como justificante de compra. ' +
    '<strong>Recomendación:</strong> confirme precios y stock antes de realizar la compra definitiva.</p>' +
    '</div>' +
    '</div>';

  const items = Array.isArray(b['Líneas del presupuesto']) ? b['Líneas del presupuesto'] : [];
  const pages = chunkArray(items, ROWS_PER_PAGE);

  const colgroupHtml = '<colgroup><col class="desc"><col class="ref"><col class="qty"><col class="disc"><col class="price"><col class="total"></colgroup>';
  const theadHtml = '<thead><tr>' +
    '<th>Designación</th><th>Referencia</th><th>Ctd</th><th>Tipo IVA</th><th>Precio Unitario</th><th>Importe con IVA</th>' +
    '</tr></thead>';

  const totalsHtml = '' +
    '<div class="totals-signature">' +
    '<div class="totals-wrap">' +
    '<div class="totals">' +
    '<div class="totals-row bold"><span>Total sin IVA</span><span class="num">' + money(subtotal) + '</span></div>' +
    '<div class="totals-row"><span>Montante IVA 21</span><span class="num">' + (hasIva ? money(ivaAmount) : '') + '</span></div>' +
    '<div class="totals-row final"><span>Total con IVA</span><span class="num">' + money(total) + '</span></div>' +
    '</div>' +
    '</div>' +
    '<div class="signature-wrap"><div class="signature">Firma:</div></div>' +
    '</div>';

  const lastIndex = pages.length - 1;

  const pagesHtml = pages.map(function (pageItems, pageIndex) {
    const rows = pageItems.map(function (item) {
      return '<tr>' +
        '<td class="desc">' + esc(item['Designación'] || '') + '</td>' +
        '<td>' + esc(item['Referencia'] || '') + '</td>' +
        '<td class="num">' + num(item['Cantidad']) + '</td>' +
        '<td class="num">' + num(item['%']) + '</td>' +
        '<td class="num">' + money(item['Precio €']) + '</td>' +
        '<td class="num">' + money(item['Total']) + '</td>' +
        '</tr>';
    }).join('');

    const breakClass = pageIndex === 0 ? '' : ' page-break';
    const extras = (pageIndex === lastIndex) ? totalsHtml : '';

    return '<div class="content' + breakClass + '">' +
      '<table class="items">' + colgroupHtml + theadHtml + '<tbody>' + rows + '</tbody></table>' +
      extras +
      '</div>';
  }).join('');

  return pageHeaderHtml + legalFooterHtml + pagesHtml;
}

document.getElementById('page').innerHTML = buildBudgetHtml(BUDGET);
